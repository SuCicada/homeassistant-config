    current_volume_template: >
      {% set media = states('sensor.media_linux_status') | from_json(default={'volume': 0}) %}
      {{ media.volume | float(0) / 100 }}


    current_is_muted_template: >
      {% set media = states('sensor.media_linux_status') | from_json(default={'is_muted': false}) %}
      {{ media.is_muted | bool(false) }}

      
