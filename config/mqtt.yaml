light:
    - name: "Linux Display"
      unique_id: "linux_light"
      # entity_id: "linux_display"
      command_topic: sucicada/home/light/linux_display/cmd
      state_topic: sucicada/home/light/linux_display/state
      
      # JSON模式配置，支持滑动开关
      schema: json
      brightness: true
      brightness_scale: 100
      
      # JSON模式下，状态和亮度都从同一个state_topic获取
      # 设备需要发布格式如下的JSON消息：
      # {"state": "ON", "brightness": 80}
      
      # 可用性配置
      # availability:
        # - topic: "sucicada/home/light/linux_display/availability"
      
      # QoS和优化设置
      qos: 1
      optimistic: false  # 等待状态确认，确保滑动开关响应
      retain: true       # 保留消息，确保状态持久化
  
sensor:
    # 播放状态
    - name: media_windows_status
      unique_id: sucicada/home/media/windows/status  # 这里必须有才生效
      state_topic: "sucicada/home/media/windows/status"  # 替换成你实际的 topic
    
    - name: media_windows_is_muted
      unique_id: sucicada/home/media/windows/is_muted
      state_topic: "sucicada/home/media/windows/is_muted"
      
    - name: media_windows_volume
      unique_id: sucicada/home/media/windows/volume
      state_topic: "sucicada/home/media/windows/volume"
      