# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


# MQTT 配置
# mqtt:
# broker: localhost  # 请根据您的 MQTT 服务器地址修改
# port: 1883
# 如果您的 MQTT 服务器不需要认证，请注释掉下面两行
# username: !secret mqtt_username  # 可选：如果您的 MQTT 服务器需要认证
# password: !secret mqtt_password  # 可选：如果您的 MQTT 服务器需要认证
# discovery: true  # 可选：启用 MQTT 自动发现
# configuration.yaml
# mqtt:
#   broker: your_mqtt_broker_ip
#   port: 1883
#   username: your_username
#   password: your_password
#   discovery: true  # 必须启用
#   discovery_prefix: homeassistant  # 默认值
mqtt: !include mqtt.yaml
media_player: !include media_player.yaml

